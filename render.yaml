services:
  - type: worker
    name: bd-otp-pro-bot
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    disk:
      name: bd-otp-pro-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /var/data/bd_otp_pro.sqlite3
      - key: ADMIN_IDS
        value: ""
      - key: SUPPORT_USERNAME
        value: ""
      - key: LOG_LEVEL
        value: INFO
